name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  

jobs:
  test:
    runs-on: ubuntu-latest
  
    env:
      CLIENT_ID: "ci-dummy-twitch-client-id"
      CLIENT_SECRET: "ci-dummy-twitch-client-secret"
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
      JWT_SECRET_KEY: "ci-test-jwt-secret-key-32-chars-minimum"

    steps:
      # download rep
      - name: Checkout repository
        uses: actions/checkout@v7
      
      # set up python to match dockerfile
      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
        
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
        
      - name: Run pytest
        run: |
          cd backend
          pytest -v
    
  deploy:
    needs: test
    # only deploy on pushes to main, not PRs or failed tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"